<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA DRIFT — a neon arcade space shooter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M28 16 L4 6 L10 16 L4 26 Z' fill='%2322d3ee'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #04040d;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #wrap {
    position: relative;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 1280 / 800;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #04040d;
    cursor: crosshair;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="800"></canvas>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
